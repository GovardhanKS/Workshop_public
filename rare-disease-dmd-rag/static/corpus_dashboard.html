<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rare Disease DMD RAG -- Corpus Dashboard</title>
<style>
  html, body { margin: 0; }
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent:         #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:      #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent:         #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --accent:         #3987e5;
  }

  * { box-sizing: border-box; }
  .viz-root {
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 20px 64px;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header.page-head { margin-bottom: 28px; }
  header.page-head h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  header.page-head p { margin: 0; color: var(--text-secondary); font-size: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px;
  }
  .tile .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; }
  .tile .value { font-size: 30px; font-weight: 700; line-height: 1; color: var(--accent); }
  .tile .desc { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

  table.acc-table { width: 100%; border-collapse: collapse; margin-top: 32px; font-size: 13px; }
  table.acc-table th, table.acc-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline); }
  table.acc-table th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.acc-table td { color: var(--text-secondary); }
  table.acc-table td.num { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="viz-root">
  <div class="wrap">
    <header class="page-head">
      <h1>Corpus at a glance</h1>
      <p>Live counts from <code>rag.corpus.counts_by_source()</code> -- served from this app's own API, not a third-party link.</p>
    </header>

    <div class="tiles" id="tiles"></div>

    <table class="acc-table">
      <thead><tr><th>Source</th><th>Documents</th><th>Where it comes from</th></tr></thead>
      <tbody id="acc-body"></tbody>
    </table>
  </div>
</div>

<script>
  const DATA = [
    { key: "trial", label: "Trials", count: 353, desc: "ClinicalTrials.gov, live" },
    { key: "literature", label: "Literature", count: 7620, desc: "PubMed, live" },
    { key: "biomarker", label: "Biomarker", count: 61, desc: "ChEMBL + Open Targets + curated endpoints" },
    { key: "regulatory", label: "Regulatory", count: 19, desc: "openFDA-verified + curated guidance" },
  ];

  const tiles = document.getElementById("tiles");
  const accBody = document.getElementById("acc-body");
  DATA.forEach(d => {
    tiles.insertAdjacentHTML("beforeend", `
      <div class="tile">
        <div class="label">${d.label}</div>
        <div class="value">${d.count.toLocaleString()}</div>
        <div class="desc">${d.desc}</div>
      </div>
    `);
    accBody.insertAdjacentHTML("beforeend", `
      <tr><td>${d.label}</td><td class="num">${d.count.toLocaleString()}</td><td>${d.desc}</td></tr>
    `);
  });
</script>
</body>
</html>
